workflows:
  p0-validation:
    name: Prova Social - Validar P0 sem publicação
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Diagnosticar SDK
        script: |
          set -e
          flutter --version
          dart --version
      - name: Resolver dependências
        script: flutter pub get
      - name: Verificar formatação
        script: |
          set -e
          if dart format --output=none --set-exit-if-changed .; then
            exit 0
          else
            format_status=$?
          fi
          # Collect the official correction for review; keep the gate failed.
          mkdir -p artifacts/format
          git rev-parse HEAD > artifacts/format/base-sha.txt
          flutter --version > artifacts/format/flutter-version.txt
          dart --version > artifacts/format/dart-version.txt 2>&1
          dart format . > artifacts/format/write.log 2>&1
          git diff --binary -- '*.dart' > artifacts/format/dart-format.patch
          if dart format --output=none --set-exit-if-changed . > artifacts/format/recheck.log 2>&1; then
            echo 0 > artifacts/format/recheck-status.txt
          else
            echo "$?" > artifacts/format/recheck-status.txt
          fi
          exit "$format_status"
      - name: Analisar Flutter
        script: flutter analyze
      - name: Executar testes
        script: flutter test --reporter expanded
    artifacts:
      - artifacts/format/**

  web-ci:
    name: Prova Social - Testes e Web
    max_build_duration: 30
    environment:
      groups:
        - Token
      flutter: stable
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.npm
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Diagnosticar SDK
        script: |
          set -e
          flutter --version
          dart --version
      - name: Validar configuração
        script: |
          set -e
          missing=""
          for variable_name in \
            SUPABASE_URL \
            SUPABASE_PUBLISHABLE_KEY \
            CLOUDFLARE_API_TOKEN \
            CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!variable_name:-}" ]; then
              missing="$missing $variable_name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "Variáveis ausentes no grupo Token:$missing"
            exit 1
          fi

      - name: Preparar Flutter Web
        script: |
          set -e
          flutter create . \
            --platforms=web \
            --project-name=prova_social \
            --org=dev.nagcode \
            --no-pub
          rm -f test/widget_test.dart
          python3 - <<'PY'
          from pathlib import Path

          manifest_path = Path('web/manifest.json')
          manifest = manifest_path.read_text()
          manifest = manifest.replace('prova_social', 'Prova Social')
          manifest_path.write_text(manifest)

          index_path = Path('web/index.html')
          index = index_path.read_text()
          index = index.replace(
              '<title>prova_social</title>',
              '<title>Prova Social</title>',
          )
          index = index.replace(
              'A new Flutter project.',
              'Resolva provas e descubra o que precisa estudar.',
          )
          index_path.write_text(index)
          PY

      - name: Instalar e validar
        script: |
          set -e
          flutter pub get
          dart run tool/generate_web_icons.dart
          dart format --output=none --set-exit-if-changed .
          flutter analyze
          flutter test --reporter expanded

      - name: Compilar Flutter Web
        script: |
          flutter build web --release --base-href /app/ \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=WEB_AUTH_CALLBACK="https://prova-social.pages.dev/app/"

      - name: Publicar no Cloudflare Pages
        script: |
          set -e
          rm -rf site/app
          mkdir -p site/app
          cp -R build/web/. site/app/
          APP_VERSION=$(awk '/^version:/{print $2; exit}' pubspec.yaml)
          printf '{"version":"%s","build":"%s","date":"%s"}\n' \
            "$APP_VERSION" \
            "${BUILD_NUMBER:-0}" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > site/app/version.json
          npx --yes wrangler@4.132.0 pages deploy site \
            --project-name=prova-social \
            --branch=main
    artifacts:
      - build/web/**

  android-debug-apk:
    name: Prova Social - Release Android e Web
    max_build_duration: 60
    environment:
      groups:
        - Token
      flutter: stable
      android_signing:
        - Prova-Key
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - $HOME/.npm
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Diagnosticar SDK
        script: |
          set -e
          flutter --version
          dart --version
      - name: Validar configuração de lançamento
        script: |
          set -e
          missing=""
          for variable_name in \
            SUPABASE_URL \
            SUPABASE_PUBLISHABLE_KEY \
            CLOUDFLARE_API_TOKEN \
            CLOUDFLARE_ACCOUNT_ID \
            GITHUB_TOKEN \
            CM_KEYSTORE_PATH \
            CM_KEYSTORE_PASSWORD \
            CM_KEY_ALIAS \
            CM_KEY_PASSWORD; do
            if [ -z "${!variable_name:-}" ]; then
              missing="$missing $variable_name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "Configuração incompleta:$missing"
            exit 1
          fi
          if [ -z "${CM_TAG:-}" ]; then
            echo "Este workflow só publica versões iniciadas por tag."
            exit 1
          fi

      - name: Preparar Android e Web
        script: |
          set -e
          flutter create . \
            --platforms=android,web \
            --project-name=prova_social \
            --org=dev.nagcode \
            --no-pub
          test -f android/app/build.gradle.kts -o -f android/app/build.gradle
          rm -f test/widget_test.dart
          python3 - <<'PY'
          from pathlib import Path

          manifest_path = Path('android/app/src/main/AndroidManifest.xml')
          manifest = manifest_path.read_text()
          manifest = manifest.replace(
              'android:label="prova_social"',
              'android:label="Prova Social"',
          )
          if 'android.permission.INTERNET' not in manifest:
              manifest = manifest.replace(
                  '<application',
                  '<uses-permission android:name="android.permission.INTERNET"/>\n'
                  '    <application',
                  1,
              )
          if 'android:scheme="provasocial"' not in manifest:
              intent_filter = '''
                <intent-filter>
                    <action android:name="android.intent.action.VIEW" />
                    <category android:name="android.intent.category.DEFAULT" />
                    <category android:name="android.intent.category.BROWSABLE" />
                    <data
                        android:scheme="provasocial"
                        android:host="login-callback" />
                </intent-filter>'''
              manifest = manifest.replace(
                  '</activity>',
                  intent_filter + '\n            </activity>',
                  1,
              )
          manifest_path.write_text(manifest)

          web_manifest_path = Path('web/manifest.json')
          web_manifest = web_manifest_path.read_text()
          web_manifest = web_manifest.replace('prova_social', 'Prova Social')
          web_manifest_path.write_text(web_manifest)

          web_index_path = Path('web/index.html')
          web_index = web_index_path.read_text()
          web_index = web_index.replace(
              '<title>prova_social</title>',
              '<title>Prova Social</title>',
          )
          web_index = web_index.replace(
              'A new Flutter project.',
              'Resolva provas e descubra o que precisa estudar.',
          )
          web_index_path.write_text(web_index)
          PY

          cat > android/key.properties <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF

          cat > android/app/proguard-rules.pro <<'EOF'
          -dontwarn com.google.mlkit.vision.text.chinese.**
          -dontwarn com.google.mlkit.vision.text.devanagari.**
          -dontwarn com.google.mlkit.vision.text.japanese.**
          -dontwarn com.google.mlkit.vision.text.korean.**
          EOF

          python3 - <<'PY'
          from pathlib import Path

          candidates = [
              Path('android/app/build.gradle.kts'),
              Path('android/app/build.gradle'),
          ]
          path = next((item for item in candidates if item.exists()), None)
          if path is None:
              raise SystemExit('Gradle Android não foi gerado.')
          text = path.read_text()
          if 'CM_KEYSTORE_PATH' not in text:
              if path.suffix == '.kts':
                  signing = '''    signingConfigs {
                  create("release") {
                      storeFile = file(System.getenv("CM_KEYSTORE_PATH"))
                      storePassword = System.getenv("CM_KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("CM_KEY_ALIAS")
                      keyPassword = System.getenv("CM_KEY_PASSWORD")
                  }
              }

          '''
              else:
                  signing = '''    signingConfigs {
                  release {
                      storeFile file(System.getenv("CM_KEYSTORE_PATH"))
                      storePassword System.getenv("CM_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("CM_KEY_ALIAS")
                      keyPassword System.getenv("CM_KEY_PASSWORD")
                  }
              }

          '''
              text = text.replace('    buildTypes {', signing + '    buildTypes {')
          if path.suffix == '.kts':
              text = text.replace(
                  'signingConfig = signingConfigs.getByName("debug")',
                  'signingConfig = signingConfigs.getByName("release")',
              )
              release_marker = '        release {'
              proguard_line = (
                  '            proguardFiles('
                  'getDefaultProguardFile("proguard-android-optimize.txt"), '
                  '"proguard-rules.pro")\n'
              )
          else:
              text = text.replace(
                  'signingConfig signingConfigs.debug',
                  'signingConfig signingConfigs.release',
              )
              release_marker = '        release {'
              proguard_line = (
                  "            proguardFiles getDefaultProguardFile("
                  "'proguard-android-optimize.txt'), 'proguard-rules.pro'\n"
              )
          if 'proguard-rules.pro' not in text:
              text = text.replace(
                  release_marker,
                  release_marker + '\n' + proguard_line,
                  1,
              )
          path.write_text(text)
          PY

      - name: Instalar e validar
        script: |
          set -e
          flutter pub get
          dart run flutter_launcher_icons
          dart run tool/generate_web_icons.dart
          dart format --output=none --set-exit-if-changed .
          flutter analyze
          flutter test --reporter expanded

      - name: Compilar lançamento
        script: |
          set -e
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=WEB_AUTH_CALLBACK="https://prova-social.pages.dev/app/"
          cp build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/flutter-apk/prova-social-android.apk

          flutter build apk --release --split-per-abi \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=WEB_AUTH_CALLBACK="https://prova-social.pages.dev/app/"

          flutter build web --release --base-href /app/ \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=WEB_AUTH_CALLBACK="https://prova-social.pages.dev/app/"

      - name: Publicar no Cloudflare Pages
        script: |
          set -e
          rm -rf site/app
          mkdir -p site/app
          cp -R build/web/. site/app/
          APP_VERSION=$(awk '/^version:/{print $2; exit}' pubspec.yaml)
          printf '{"version":"%s","build":"%s","date":"%s"}\n' \
            "$APP_VERSION" \
            "${BUILD_NUMBER:-0}" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > site/app/version.json
          npx --yes wrangler@4.132.0 pages deploy site \
            --project-name=prova-social \
            --branch=main

      - name: Publicar GitHub Release
        script: |
          set -e
          export GH_TOKEN="$GITHUB_TOKEN"
          assets=(
            build/app/outputs/flutter-apk/prova-social-android.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          )
          if gh release view "$CM_TAG" \
            --repo NAGCODE-Dev/Prova-Social >/dev/null 2>&1; then
            gh release upload "$CM_TAG" "${assets[@]}" \
              --repo NAGCODE-Dev/Prova-Social \
              --clobber
          else
            gh release create "$CM_TAG" "${assets[@]}" \
              --repo NAGCODE-Dev/Prova-Social \
              --title "Prova Social $CM_TAG" \
              --generate-notes
          fi
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/web/**
