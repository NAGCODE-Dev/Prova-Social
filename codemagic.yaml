workflows:
  android-debug-apk:
    name: Prova Social - Android e Web
    max_build_duration: 60
    environment:
      groups:
        - Token
      flutter: stable
      android_signing:
        - Prova-Key
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
          source: true
        - pattern: '*'
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Preparar plataforma e assinatura Android
        script: |
          set -e
          flutter create . \
            --platforms=android,web \
            --project-name=prova_social \
            --org=dev.nagcode \
            --no-pub
          test -d android
          test -d web
          test -f android/app/build.gradle.kts -o -f android/app/build.gradle
          rm -f test/widget_test.dart
          python3 - <<'PY'
          from pathlib import Path

          manifest_path = Path('android/app/src/main/AndroidManifest.xml')
          manifest = manifest_path.read_text()
          manifest = manifest.replace(
              'android:label="prova_social"',
              'android:label="Prova Social"',
          )
          if 'android.permission.INTERNET' not in manifest:
              manifest = manifest.replace(
                  '<application',
                  '<uses-permission android:name="android.permission.INTERNET"/>\n'
                  '    <application',
                  1,
              )
          if 'provasocial' not in manifest:
              intent_filter = '''
                <intent-filter>
                    <action android:name="android.intent.action.VIEW" />
                    <category android:name="android.intent.category.DEFAULT" />
                    <category android:name="android.intent.category.BROWSABLE" />
                    <data
                        android:scheme="provasocial"
                        android:host="login-callback" />
                </intent-filter>'''
              manifest = manifest.replace(
                  '</activity>',
                  intent_filter + '\n            </activity>',
                  1,
              )
          manifest_path.write_text(manifest)

          web_manifest_path = Path('web/manifest.json')
          web_manifest = web_manifest_path.read_text()
          web_manifest = web_manifest.replace('prova_social', 'Prova Social')
          web_manifest_path.write_text(web_manifest)

          web_index_path = Path('web/index.html')
          web_index = web_index_path.read_text()
          web_index = web_index.replace(
              '<title>prova_social</title>',
              '<title>Prova Social</title>',
          )
          web_index = web_index.replace(
              'A new Flutter project.',
              'Resolva provas e descubra o que precisa estudar.',
          )
          web_index_path.write_text(web_index)
          PY
          mkdir -p android
          cat > android/key.properties <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF
          cat > android/app/proguard-rules.pro <<'EOF'
          # O app usa somente o reconhecedor latino, incluído pelo plugin.
          # Os demais reconhecedores são módulos opcionais e não fazem parte do APK.
          -dontwarn com.google.mlkit.vision.text.chinese.**
          -dontwarn com.google.mlkit.vision.text.devanagari.**
          -dontwarn com.google.mlkit.vision.text.japanese.**
          -dontwarn com.google.mlkit.vision.text.korean.**
          EOF
          python3 - <<'PY'
          from pathlib import Path

          candidates = [
              Path('android/app/build.gradle.kts'),
              Path('android/app/build.gradle'),
          ]
          path = next((item for item in candidates if item.exists()), None)
          if path is None:
              raise SystemExit('Gradle Android não foi gerado pelo flutter create.')
          text = path.read_text()
          if 'CM_KEYSTORE_PATH' not in text:
              if path.suffix == '.kts':
                  signing = '''    signingConfigs {
                  create("release") {
                      storeFile = file(System.getenv("CM_KEYSTORE_PATH"))
                      storePassword = System.getenv("CM_KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("CM_KEY_ALIAS")
                      keyPassword = System.getenv("CM_KEY_PASSWORD")
                  }
              }

          '''
              else:
                  signing = '''    signingConfigs {
                  release {
                      storeFile file(System.getenv("CM_KEYSTORE_PATH"))
                      storePassword System.getenv("CM_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("CM_KEY_ALIAS")
                      keyPassword System.getenv("CM_KEY_PASSWORD")
                  }
              }

          '''
              text = text.replace('    buildTypes {', signing + '    buildTypes {')
          if path.suffix == '.kts':
              text = text.replace(
                  'signingConfig = signingConfigs.getByName("debug")',
                  'signingConfig = signingConfigs.getByName("release")',
              )
              release_marker = '        release {'
              proguard_line = (
                  '            proguardFiles('
                  'getDefaultProguardFile("proguard-android-optimize.txt"), '
                  '"proguard-rules.pro")\n'
              )
          else:
              text = text.replace(
                  'signingConfig signingConfigs.debug',
                  'signingConfig signingConfigs.release',
              )
              release_marker = '        release {'
              proguard_line = (
                  "            proguardFiles getDefaultProguardFile("
                  "'proguard-android-optimize.txt'), 'proguard-rules.pro'\n"
              )
          if 'proguard-rules.pro' not in text:
              if release_marker not in text:
                  raise SystemExit(
                      'Bloco release não encontrado na configuração Android.'
                  )
              text = text.replace(
                  release_marker,
                  release_marker + '\n' + proguard_line,
                  1,
              )
          path.write_text(text)
          PY
      - name: Instalar dependências
        script: flutter pub get
      - name: Aplicar ícone do aplicativo
        script: |
          dart run flutter_launcher_icons
          dart run tool/generate_web_icons.dart
      - name: Formatar código
        script: dart format lib test
      - name: Analisar código
        script: flutter analyze --no-fatal-infos
      - name: Executar testes
        script: flutter test
      - name: Gerar APK universal assinado
        script: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=WEB_AUTH_CALLBACK="https://prova-social.pages.dev/app/"
          cp build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/flutter-apk/prova-social-android.apk
      - name: Gerar APKs compactos assinados
        script: |
          flutter build apk --release --split-per-abi \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=WEB_AUTH_CALLBACK="https://prova-social.pages.dev/app/"
      - name: Gerar versão web
        script: |
          flutter build web --release --base-href /app/ \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=WEB_AUTH_CALLBACK="https://prova-social.pages.dev/app/"
      - name: Publicar site e Flutter Web
        script: |
          set -e
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || \
             [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Cloudflare não configurado: defina CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
          rm -rf site/app
          mkdir -p site/app
          cp -R build/web/. site/app/
          printf '{"version":"%s","build":"%s","date":"%s"}\n' \
            "${CM_TAG:-development}" \
            "${BUILD_NUMBER:-0}" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > site/app/version.json
          npx --yes wrangler@4.132.0 pages deploy site \
            --project-name=prova-social \
            --branch=main
      - name: Publicar GitHub Release
        script: |
          if [ -z "${CM_TAG:-}" ]; then
            echo "Build sem tag: os artefatos não serão publicados como Release."
            exit 0
          fi
          export GH_TOKEN="$GITHUB_TOKEN"
          gh release create "$CM_TAG" \
            --repo NAGCODE-Dev/Prova-Social \
            --title "Prova Social $CM_TAG" \
            --generate-notes \
            build/app/outputs/flutter-apk/prova-social-android.apk \
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            build/app/outputs/flutter-apk/app-x86_64-release.apk
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/web/**
