workflows:
  android-debug-apk:
    name: Prova Social - APK Android
    max_build_duration: 60

    environment:
      flutter: stable

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true

    scripts:
      - name: Preparar projeto Android
        script: |
          if [ ! -d android ]; then
            flutter create . --platforms=android,web --project-name=prova_social --org=dev.nagcode
          fi
          if [ -f test/widget_test.dart ]; then
            rm test/widget_test.dart
          fi

      - name: Instalar dependências
        script: flutter pub get

      - name: Formatar código
        script: dart format lib test

      - name: Analisar código
        script: flutter analyze --no-fatal-infos

      - name: Executar testes
        script: flutter test

      - name: Gerar APK de teste
        script: flutter build apk --debug

    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
      - build/app/outputs/flutter-apk/*.apk