name: Prova Social CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_file:
        description: 'Arquivo Dart opcional para diagnóstico serial da suíte Flutter'
        required: false
        type: string
      test_name:
        description: 'Nome opcional para filtrar um teste dentro do arquivo'
        required: false
        type: string
  schedule:
    - cron: '15 6 * * *'

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.0'
  NODE_VERSION: '22'
  WRANGLER_VERSION: '4.132.0'

concurrency:
  group: prova-social-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-security-audit:
    name: Vulnerabilidades npm
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: qa/browser/package-lock.json

      - name: Validar lockfile e instalar sem scripts
        working-directory: qa/browser
        run: npm ci --ignore-scripts

      - name: Bloquear dependências vulneráveis
        working-directory: qa/browser
        run: npm audit --audit-level=low

  osv-security-audit:
    name: Vulnerabilidades Dart e lockfiles
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0

  android-gradle-lock:
    name: Resolver dependências Android
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Gerar projeto Android e resolver Dart
        run: |
          flutter create . --platforms=android --project-name=prova_social --org=dev.nagcode --no-pub
          flutter pub get
          python3 tool/enable_gradle_dependency_locking.py android/app

      - name: Gerar lockfile do classpath Android de produção
        run: |
          cd android
          ./gradlew --no-daemon --write-locks :paddleocr_android:dependencies \
            --configuration releaseRuntimeClasspath
          ./gradlew --no-daemon --write-locks :app:dependencies \
            --configuration releaseRuntimeClasspath
          test -s app/gradle.lockfile
          test -s ../packages/paddleocr_android/android/gradle.lockfile
          cd ..

      - name: Publicar lockfile resolvido
        uses: actions/upload-artifact@v4
        with:
          name: android-gradle-lockfile
          path: |
            android/app/gradle.lockfile
            packages/paddleocr_android/android/gradle.lockfile
          if-no-files-found: error
          retention-days: 1

  osv-android-gradle-audit:
    name: Vulnerabilidades Gradle Android
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: android-gradle-lock
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      download-artifact: android-gradle-lockfile
      results-file-name: android-gradle-results.sarif
      scan-args: |-
        --lockfile=android/app/gradle.lockfile
        --lockfile=packages/paddleocr_android/android/gradle.lockfile

  qa-full:
    name: QA Completo
    timeout-minutes: 20
    if: github.event_name != 'schedule' && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Preparar Flutter
        run: |
          flutter create . --platforms=web --project-name=prova_social --org=dev.nagcode --no-pub
          rm -f test/widget_test.dart
          flutter pub get

      - name: Exportar lockfile Dart para revisão
        uses: actions/upload-artifact@v4
        with:
          name: flutter-resolved-pubspec-lock
          path: pubspec.lock
          if-no-files-found: error
          retention-days: 1

      - name: QA estático
        run: bash qa/run_static.sh

      - name: Testes Flutter
        env:
          FLUTTER_TEST_FILE: ${{ inputs.test_file }}
          FLUTTER_TEST_NAME: ${{ inputs.test_name }}
        run: bash qa/run_tests.sh

      - name: QA P0 e banco local
        run: bash qa/run_p0.sh

      - name: Compilar Web para QA
        env:
          WEB_AUTH_CALLBACK: http://127.0.0.1:4173/app/
        run: bash qa/run_web.sh

      - name: Browser QA
        run: bash qa/run_browser.sh

      - name: Salvar artefatos QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-results
          path: |
            build/qa/**
            qa/browser/test-results/**
            qa/browser/playwright-report/**
          if-no-files-found: ignore

  web-deploy-readiness:
    name: Verificar configuração de deploy Web
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Verificar secrets necessários para publicar
        id: check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=()
          for name in SUPABASE_URL SUPABASE_PUBLISHABLE_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          if ((${#missing[@]} > 0)); then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy Web ignorado; configure os secrets obrigatórios no repositório."
            printf 'Secrets ausentes: %s\n' "${missing[*]}"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Secrets disponíveis; o deploy Web será executado."
          fi

  web-ci:
    name: Web + Cloudflare Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.web-deploy-readiness.outputs.enabled == 'true'
    needs: [qa-full, npm-security-audit, osv-security-audit, osv-android-gradle-audit, web-deploy-readiness]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Preparar Flutter Web
        run: |
          flutter create . --platforms=web --project-name=prova_social --org=dev.nagcode --no-pub
          rm -f test/widget_test.dart

          python3 - <<'PY'
          from pathlib import Path

          p = Path("web/manifest.json")
          p.write_text(p.read_text().replace("prova_social", "Prova Social"))

          p = Path("web/index.html")
          s = p.read_text()
          s = s.replace("<title>prova_social</title>", "<title>Prova Social</title>")
          s = s.replace("A new Flutter project.", "Resolva provas e descubra o que precisa estudar.")
          p.write_text(s)
          PY

      - name: Instalar e validar
        run: |
          flutter pub get --enforce-lockfile
          dart run tool/generate_web_icons.dart
          dart format --output=none --set-exit-if-changed lib test tool packages
          flutter analyze
          flutter test

      - name: Build Web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          flutter build web --release --base-href /app/ \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=WEB_AUTH_CALLBACK="https://prova-social.pages.dev/app/"
          test -f build/web/index.html
          test -f build/web/flutter_bootstrap.js
          test -f build/web/assets/AssetManifest.bin \
            || test -f build/web/assets/AssetManifest.json

      - name: Preparar site
        run: |
          set -euo pipefail
          rm -rf site/app
          mkdir -p site/app
          cp -R build/web/. site/app/
          APP_VERSION=$(awk '/^version:/{print $2; exit}' pubspec.yaml)
          printf '{"version":"%s","build":"%s","date":"%s"}\n' \
            "$APP_VERSION" "$GITHUB_RUN_NUMBER" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > site/app/version.json

      - name: Deploy Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@${WRANGLER_VERSION} pages deploy site \
            --project-name=prova-social \
            --branch=main

      - name: Salvar Web
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-${{ github.run_id }}
          if-no-files-found: error
          path: |
            build/web/**
            site/**

  android-release:
    name: Android Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [npm-security-audit, osv-security-audit, osv-android-gradle-audit]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Validar secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          KEYSTORE_BASE64: ${{ secrets.PROVA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CM_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CM_KEY_PASSWORD }}
        run: |
          set -e
          for name in SUPABASE_URL SUPABASE_PUBLISHABLE_KEY KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Secret ausente: $name"
              exit 1
            fi
          done

      - name: Impedir sobrescrita de release existente
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "A release $GITHUB_REF_NAME já existe e não será alterada." >&2
            exit 1
          fi

      - name: Preparar Android
        env:
          KEYSTORE_BASE64: ${{ secrets.PROVA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CM_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CM_KEY_PASSWORD }}
        run: |
          set -e

          flutter create . --platforms=android --project-name=prova_social --org=dev.nagcode --no-pub
          rm -f test/widget_test.dart

          echo "$KEYSTORE_BASE64" | base64 --decode > android/prova-social-release.jks

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../prova-social-release.jks
          EOF

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text().replace(
              'android:label="prova_social"',
              'android:label="Prova Social"'
          )

          if "android.permission.INTERNET" not in s:
              s = s.replace(
                  "<application",
                  '<uses-permission android:name="android.permission.INTERNET"/>\n'
                  "    <application",
                  1,
              )

          if 'android:scheme="provasocial"' not in s:
              intent_filter = """                <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="provasocial" android:host="login-callback" />
                  </intent-filter>"""
              s = s.replace("</activity>", intent_filter + "\n            </activity>", 1)

          p.write_text(s)
          PY

          cat > android/app/proguard-rules.pro <<'EOF'
          -dontwarn com.google.mlkit.vision.text.chinese.**
          -dontwarn com.google.mlkit.vision.text.devanagari.**
          -dontwarn com.google.mlkit.vision.text.japanese.**
          -dontwarn com.google.mlkit.vision.text.korean.**
          EOF

          python3 - <<'PY'
          from pathlib import Path

          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]
          path = next((p for p in candidates if p.exists()), None)

          if path is None:
              raise SystemExit("Gradle Android não foi gerado.")

          s = path.read_text()

          if path.suffix == ".kts":
              min_sdk_marker = "minSdk = flutter.minSdkVersion"
              signing = """    signingConfigs {
                  create("release") {
                      storeFile = file("../prova-social-release.jks")
                      storePassword = System.getenv("KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("KEY_ALIAS")
                      keyPassword = System.getenv("KEY_PASSWORD")
                  }
              }

          """
              if 'create("release")' not in s:
                  s = s.replace("    buildTypes {", signing + "    buildTypes {", 1)

              s = s.replace(
                  'signingConfig = signingConfigs.getByName("debug")',
                  'signingConfig = signingConfigs.getByName("release")'
              )

              if "proguard-rules.pro" not in s:
                  s = s.replace(
                      "        release {",
                      '        release {\n'
                      '            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")',
                      1,
                  )
          else:
              min_sdk_marker = "minSdkVersion flutter.minSdkVersion"
              signing = """    signingConfigs {
                  release {
                      storeFile file("../prova-social-release.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }

          """
              if "signingConfigs {" not in s:
                  s = s.replace("    buildTypes {", signing + "    buildTypes {", 1)

              s = s.replace(
                  "signingConfig signingConfigs.debug",
                  "signingConfig signingConfigs.release"
              )

              if "proguard-rules.pro" not in s:
                  s = s.replace(
                      "        release {",
                      "        release {\n"
                      "            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'",
                      1,
                  )

          if min_sdk_marker not in s:
              raise SystemExit("Não foi possível configurar Android API 26 para o SDK PaddleOCR.")
          s = s.replace(min_sdk_marker, min_sdk_marker.replace("flutter.minSdkVersion", "26"), 1)

          path.write_text(s)
          PY

      - name: Habilitar lockfile Android
        run: python3 tool/enable_gradle_dependency_locking.py android/app

      - name: Usar lockfile Android auditado
        uses: actions/download-artifact@v4
        with:
          name: android-gradle-lockfile
          path: .

      - name: Confirmar lockfile Android
        run: |
          test -s android/app/gradle.lockfile
          test -s packages/paddleocr_android/android/gradle.lockfile

      - name: Instalar e validar
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          dart run flutter_launcher_icons
          dart run tool/generate_web_icons.dart
          dart format --output=none --set-exit-if-changed lib test tool packages
          flutter analyze
          flutter test

      - name: Compilar APKs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail

          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=WEB_AUTH_CALLBACK="https://prova-social.pages.dev/app/"

          cp build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/prova-social-android.apk

          flutter build apk --release --split-per-abi \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=WEB_AUTH_CALLBACK="https://prova-social.pages.dev/app/"

      - name: Salvar APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ github.ref_name }}
          if-no-files-found: error
          path: build/app/outputs/flutter-apk/*.apk

      - name: Publicar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          assets=(
            build/app/outputs/flutter-apk/prova-social-android.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          )

          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Prova Social $GITHUB_REF_NAME" \
            --generate-notes
