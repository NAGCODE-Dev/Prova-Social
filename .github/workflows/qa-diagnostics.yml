name: QA diagnostics
on:
  push:
    branches: [p0-validation-diagnostics]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qa-diagnostics-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qa-full:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
      - name: Execute the same gate as Codemagic
        run: node qa/gate/full.mjs
      - name: Preserve formatter patch for review
        if: always()
        run: |
          mkdir -p artifacts/format
          dart format lib test tool > artifacts/format/write.log 2>&1
          git diff --binary -- '*.dart' > artifacts/format/dart-format.patch
      - name: Preserve QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qa-diagnostics-${{ github.sha }}
          path: |
            artifacts/qa-full/
            artifacts/browser/
            artifacts/integration/
            artifacts/format/
          retention-days: 7
