name: Supabase Keep Alive

on:
  schedule:
    - cron: '17 7,15,23 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  database-activity:
    name: Read-only database activity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Supabase configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_PUBLISHABLE_KEY" ]]; then
            echo "::error::SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY must be configured."
            exit 1
          fi

          if [[ "$SUPABASE_URL" != https://* ]]; then
            echo "::error::SUPABASE_URL must use HTTPS."
            exit 1
          fi

      - name: Record real database activity without writing data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail

          status=$(curl \
            --fail \
            --silent \
            --show-error \
            --retry 2 \
            --retry-delay 5 \
            --connect-timeout 10 \
            --max-time 20 \
            --output /dev/null \
            --write-out '%{http_code}' \
            --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            --header "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \
            --header 'Accept: application/json' \
            "${SUPABASE_URL%/}/rest/v1/profiles?select=id&limit=1")

          echo "Supabase database read succeeded (HTTP $status); no rows were written."
