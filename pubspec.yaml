name: prova_social
description: Plataforma social para encontrar, resolver e compartilhar provas.
publish_to: none
version: 0.2.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  archive: 4.0.7
  crypto: 3.0.6
  flutter:
    sdk: flutter
  http: ^1.5.0
  package_info_plus: ^8.3.1
  supabase_flutter: 2.10.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#16A36A"
  adaptive_icon_foreground: assets/branding/app_icon.png
  min_sdk_android: 21
