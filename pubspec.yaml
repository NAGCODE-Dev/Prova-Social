name: prova_social
description: Plataforma social para encontrar, resolver e compartilhar provas.
publish_to: none
version: 0.6.0+6

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  archive: 4.0.9
  crypto: 3.0.7
  file_picker: 13.1.0
  flutter:
    sdk: flutter
  google_mlkit_text_recognition: 0.17.1
  http: 1.6.0
  image: 4.10.1
  package_info_plus: 10.2.1
  path_provider: 2.1.5
  pdfrx: 2.6.1
  shared_preferences: 2.5.3
  supabase_flutter: 2.10.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#0A0F0D"
  adaptive_icon_foreground: assets/branding/app_icon.png
  min_sdk_android: 21
